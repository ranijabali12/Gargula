<style>
  :root {
    --bg: #040308;
    --panel: #0c0a1c;
    --purple: #9b2fff;
    --cyan: #23e9ff;
    --text: #f1f3fb;
    --muted: #83889f;
    --metal-dark: #14122a;
    --metal-light: #201c3d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100svh;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Ambient background — soft, no grid ---------- */
  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 12% 10%, rgba(155,47,255,0.16), transparent 46%),
      radial-gradient(circle at 88% 88%, rgba(35,233,255,0.11), transparent 46%),
      radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  .orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.35; z-index: 0; }
  .orb-1 { width: 300px; height: 300px; background: var(--purple); top: -100px; left: -100px; animation: drift1 28s ease-in-out infinite; }
  .orb-2 { width: 260px; height: 260px; background: var(--cyan); bottom: -110px; right: -100px; animation: drift2 32s ease-in-out infinite; }

  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(26px, 20px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-22px, -26px); } }

  /* ---------- INTRO ---------- */
  #intro {
    position: fixed;
    inset: 0;
    background: #020205;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 100;
    transition: opacity 0.9s ease;
    padding: 24px;
  }
  #intro.hide { opacity: 0; pointer-events: none; }

  .logo-stage {
    position: relative;
    width: min(52vw, 240px);
    height: min(52vw, 240px);
    border-radius: 50%;
    overflow: hidden;
  }

  .logo-glow {
    position: absolute;
    inset: -22%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(155,47,255,0.35), rgba(35,233,255,0.08) 55%, transparent 74%);
    filter: blur(20px);
    animation: pulseGlow 3.2s ease-in-out infinite;
  }

  .logo-img {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transform: scale(0.92);
    filter: saturate(1.02) contrast(1.03);
    animation: logoIn 0.7s cubic-bezier(.22,.7,.3,1) forwards 0.05s;
  }

  /* single sweep of light across the metal, like a studio reflection — not a spinning ring */
  .light-sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .light-sweep::after {
    content: "";
    position: absolute;
    top: -40%;
    left: -60%;
    width: 45%;
    height: 180%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55) 45%, rgba(35,233,255,0.35) 55%, transparent 80%);
    transform: rotate(12deg);
    opacity: 0;
    animation: sweep 1.2s ease-out forwards 0.3s;
    mix-blend-mode: overlay;
  }

  @keyframes sweep {
    0% { left: -60%; opacity: 0; }
    15% { opacity: 0.9; }
    60% { opacity: 0.4; }
    100% { left: 120%; opacity: 0; }
  }

  .logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
    opacity: 0;
    animation: ringFade 1s ease forwards 0.3s;
  }
  @keyframes ringFade { to { opacity: 1; } }

  .intro-label {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.01em;
    color: var(--text);
    opacity: 0;
    animation: labelIn 0.5s ease forwards 0.85s;
    text-align: center;
  }
  .intro-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: var(--muted);
    opacity: 0;
    animation: labelIn 0.5s ease forwards 0.95s;
    text-align: center;
  }

  @keyframes pulseGlow { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.05); } }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }
  @keyframes labelIn { to { opacity: 1; } }

  /* ---------- MAIN PAGE ---------- */
  #main {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: clamp(24px, 6vw, 44px) 18px;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #main.show { opacity: 1; }

  .wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; }

  .brand-row { display: flex; align-items: center; gap: 11px; margin-bottom: clamp(16px, 4vw, 24px); }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 12px rgba(155,47,255,0.4);
    flex-shrink: 0;
  }
  .brand-name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 14.5px; letter-spacing: 0.01em; }

  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 5vw, 33px);
    text-align: center;
    line-height: 1.3;
    max-width: 520px;
    padding: 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: clamp(13.5px, 3vw, 14.5px);
    text-align: center;
    max-width: 440px;
    margin-top: 11px;
    margin-bottom: clamp(20px, 5vw, 28px);
    padding: 0 8px;
  }

  .panel-frame {
    width: 100%;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(155deg, rgba(155,47,255,0.45), rgba(35,233,255,0.22) 45%, rgba(255,255,255,0.04) 70%);
  }

  .panel {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%), var(--panel);
    border-radius: 19px;
    padding: clamp(8px, 2vw, 12px);
    overflow: hidden;
  }

  .video-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
  }

  video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    border-radius: 12px;
    background: #000;
    z-index: 1;
    object-fit: cover;
  }

  .start-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4,3,10,0.32);
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.45s ease;
  }
  .start-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .play-icon {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(120deg, var(--purple), var(--cyan));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 34px rgba(155,47,255,0.45);
  }
  .play-icon svg { width: 24px; height: 24px; margin-left: 3px; }

  .progress-track {
    position: relative;
    width: 100%;
    height: 4px;
    background: var(--metal-dark);
    border-radius: 4px;
    margin-top: 11px;
    overflow: hidden;
    z-index: 1;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--cyan));
    box-shadow: 0 0 10px rgba(35,233,255,0.5);
    transition: width 0.2s linear;
  }

  .cta {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin-top: clamp(20px, 5vw, 26px);
    padding: 17px 22px;
    min-height: 54px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.06);
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: clamp(14.5px, 3.6vw, 15.5px);
    letter-spacing: 0.005em;
    cursor: not-allowed;
    background: linear-gradient(160deg, var(--metal-light), var(--metal-dark));
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.25s ease, box-shadow 0.25s ease, color 0.4s ease;
  }

  .cta::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.08), transparent);
    animation: sheen 3.6s ease-in-out infinite;
  }
  @keyframes sheen { 0% { left: -60%; } 50% { left: 130%; } 100% { left: 130%; } }

  .cta svg { width: 16px; height: 16px; flex-shrink: 0; }

  .cta.unlocked {
    cursor: pointer;
    color: #050310;
    border-color: transparent;
    background: linear-gradient(120deg, var(--purple), var(--cyan));
    animation: reveal 0.7s ease, glowPulse 3.8s ease-in-out infinite 0.7s;
  }
  .cta.unlocked:active { transform: scale(0.98); }
  .cta.unlocked:hover { transform: translateY(-2px); }

  @keyframes reveal { 0% { transform: scale(0.96); } 55% { transform: scale(1.02); } 100% { transform: scale(1); } }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 6px 20px rgba(155,47,255,0.2); }
    50% { box-shadow: 0 9px 30px rgba(35,233,255,0.32); }
  }

  .hint {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    min-height: 18px;
    margin-top: 11px;
  }

  /* ---------- Responsive tuning ---------- */
  @media (max-width: 480px) {
    .orb-1, .orb-2 { width: 190px; height: 190px; filter: blur(50px); }
    .brand-row { margin-bottom: 16px; }
    .cta { padding: 15px 18px; }
  }

  @media (min-width: 900px) {
    .wrap { max-width: 720px; }
    h1 { max-width: 580px; }
  }

  @media (max-height: 480px) {
    .logo-stage { width: min(32vh, 170px); height: min(32vh, 170px); }
    #intro { gap: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb-1, .orb-2, .logo-glow, .light-sweep::after, .cta::after, .cta.unlocked { animation: none !important; }
  }
</style>
</head>

    <h1>Antes de liberar seu acesso, assista até o final</h1>
    <p class="subtitle">Os últimos segundos explicam exatamente o que você recebe. Não dá pra pular.</p>

    <div class="panel-frame">
      <div class="panel">
        <!-- Vídeo de teste hospedado no archive.org. Quando tiver a versão final, troque o link abaixo -->
        <div class="video-wrap">
          <video id="video" preload="none" playsinline webkit-playsinline disablePictureInPicture oncontextmenu="return false" style="pointer-events:none;">
            <source src="https://archive.org/download/abbot-ft.-somynem.grin-hylander-abbot-1080p-h-264-youtube/Abbot%20ft.Somynem.grin%20-HYLANDER-%20%F0%9F%90%80%20-%20Abbot%20%281080p%2C%20h264%2C%20youtube%29.mp4" type="video/mp4">
            Seu navegador não suporta vídeo em HTML5.
          </video>
          <button type="button" id="startOverlay" class="start-overlay" aria-label="Assistir video">
            <span class="play-icon">
              <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20" fill="#050310"/></svg>
            </span>
          </button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <button class="cta" id="ctaBtn" disabled>
      <svg id="ctaIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="5" y="11" width="14" height="9" rx="2"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
      </svg>
      <span id="ctaLabel">Aguardando o final do vídeo</span>
    </button>
    <p class="hint" id="hint"></p>
  </div>
</div>

<script>
  // ---- INTRO ----
  const intro = document.getElementById('intro');
  const main = document.getElementById('main');
  const INTRO_DURATION_MS = 3000; // tempo ideal: rápido, mas dá pra sentir o efeito completo

  window.addEventListener('load', () => {
    setTimeout(() => {
      intro.classList.add('hide');
      main.classList.add('show');
    }, INTRO_DURATION_MS);
  });

  // ---- VIDEO / CTA ----
  const startOverlay = document.getElementById('startOverlay');
  const cta = document.getElementById('ctaBtn');
  const ctaLabel = document.getElementById('ctaLabel');
  const ctaIcon = document.getElementById('ctaIcon');
  const progressFill = document.getElementById('progressFill');
  const hint = document.getElementById('hint');
  const video = document.getElementById('video');

  // ---- CONFIGURAÇÃO ----
  const CHECKOUT_URL = "https://pay.kiwify.com.br/y3fi79n";
  const SEGUNDOS_ANTES_DO_FIM_PARA_LIBERAR = 15; // libera nos últimos 15s
  const CURVA_BARRA_PROGRESSO = 2.4; // >1 = barra corre rápido no início e desacelera perto do fim
  // -----------------------

  const UNLOCKED_ICON = '<path d="M8 11V7a4 4 0 0 1 7.4-2"/><rect x="5" y="11" width="14" height="9" rx="2"/>';

  let unlocked = false;
  let started = false;

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    cta.disabled = false;
    cta.classList.add('unlocked');
    ctaIcon.innerHTML = UNLOCKED_ICON;
    ctaLabel.textContent = 'Quero meu acesso limitado';
    hint.textContent = '';
  }

  // único gesto permitido: iniciar o vídeo com som. Depois disso não existe
  // pausa, avanço, volume ou tela cheia — só o vídeo rodando.
  startOverlay.addEventListener('click', () => {
    if (started) return;
    started = true;
    video.play();
    startOverlay.classList.add('hidden');
  });

  video.addEventListener('timeupdate', () => {
    if (!video.duration || isNaN(video.duration)) return;

    const remaining = video.duration - video.currentTime;
    const x = video.currentTime / video.duration; // progresso real, 0 a 1
    const displayPct = (1 - Math.pow(1 - x, CURVA_BARRA_PROGRESSO)) * 100; // rápido no início, lento no fim
    progressFill.style.width = displayPct + '%';

    if (!unlocked) {
      const secondsUntilUnlock = remaining - SEGUNDOS_ANTES_DO_FIM_PARA_LIBERAR;
      if (secondsUntilUnlock <= 0) {
        unlock();
      } else {
        hint.textContent = 'libera em ' + Math.ceil(secondsUntilUnlock) + 's';
      }
    }
  });

  video.addEventListener('ended', unlock);

  cta.addEventListener('click', () => {
    if (!unlocked) return;
    window.location.href = CHECKOUT_URL;
  });
</script>
